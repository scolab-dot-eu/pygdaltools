[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygdaltools"
dynamic = ["version"]
description = "Python wrapper for Gdal/OGR command line tools"
readme = "README.md"
# SPDX license identifier (PEP 639). Replaces the deprecated License :: trove classifier.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Cesar Martinez Izquierdo - SCOLAB" },
]
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Utilities",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["gdal", "ogr", "gis", "geospatial"]
dependencies = []

[project.urls]
Homepage = "https://github.com/scolab-dot-eu/pygdaltools"
Repository = "https://github.com/scolab-dot-eu/pygdaltools"
Issues = "https://github.com/scolab-dot-eu/pygdaltools/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.9",
    "tox>=4.21",
    "twine>=5",
]

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "gdaltools.metadata.version" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py37"
line-length = 120
src = ["gdaltools", "tests"]

[tool.ruff.lint]
# Focus on correctness; avoid failing CI on legacy style debt.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"gdaltools/__init__.py" = ["F401"]
