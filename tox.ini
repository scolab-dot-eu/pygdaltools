[tox]
requires =
    tox>=4.21
env_list =
    py39, py310, py311, py312, py313
    lint
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run unit tests with pytest
deps =
    pytest>=8
    .
commands =
    pytest {posargs}

[testenv:lint]
description = Run ruff linter
deps =
    ruff>=0.9
commands =
    ruff check gdaltools tests
skip_install = true
